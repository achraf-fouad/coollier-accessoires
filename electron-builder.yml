appId: "com.coollier.accessoires"
productName: "Coollier Desktop"
directories:
  output: "dist"
  buildResources: "public"
win:
  target: ["nsis", "msi"]
  icon: "icon.png"
mac:
  target: ["dmg"]
  icon: "icon.png"
linux:
  target: ["AppImage", "deb"]
  icon: "icon.png"
files:
  - "main.js"
  - "preload.js"
  - "icon.png"
  - "package.json"
  - ".next/**"
  - "public/**"
  - "node_modules/**"
extraMetadata:
  main: "main.js"
# This preserves existing web code and only adds packaging info
# Note: In production, electron-builder needs these files for packaging
